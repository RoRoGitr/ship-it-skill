<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1250" viewBox="0 0 1200 1250" role="img" aria-labelledby="title desc">
  <title id="title">Ship It: agents, models, and handoffs</title>
  <desc id="desc">The current conversation plans the change. A coordinator inherits its model and effort. Up to six packages run in parallel. Each package starts on Sonnet or Luna at medium effort, retries on Opus or Sol at medium effort, then uses Opus or Sol at xhigh effort. Design questions start at the third tier. A fresh Opus or Sol reviewer checks the round at high effort. Findings receive one fix round before the coordinator ships. Coordinators and workers hand off near 40 percent context.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1225"/><stop offset="1" stop-color="#15233b"/></linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#7d91ae"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #eef4ff; }
      .eyebrow { font-size: 14px; font-weight: 700; letter-spacing: 2px; fill: #8fd9ce; }
      .heading { font-size: 24px; font-weight: 700; }
      .body { font-size: 18px; fill: #c5d1e4; }
      .small { font-size: 16px; fill: #afbed4; }
      .model { font-size: 20px; font-weight: 700; }
      .box { fill: #1b2c46; stroke: #3a506f; stroke-width: 1.5; }
      .line { fill: none; stroke: #7d91ae; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="1250" rx="24" fill="url(#bg)"/>
  <text x="60" y="55" class="eyebrow">CORE SHIP IT · CLAUDE CODE + CODEX</text>
  <text x="60" y="108" font-size="44" font-weight="700">From “ship it” to a reviewed merge</text>
  <text x="60" y="143" class="body">A coordinator directs the work. Fresh agents build, retry, and review.</text>

  <rect x="60" y="180" width="1080" height="100" rx="16" class="box"/>
  <text x="84" y="217" class="heading">1  Plan the agreed change</text>
  <text x="84" y="250" class="body">Your current conversation · your current model and effort</text>
  <text x="1108" y="235" text-anchor="end" class="small">Write the plan in an isolated worktree</text>
  <path d="M600 280V310" class="line"/>

  <rect x="60" y="320" width="1080" height="110" rx="16" class="box"/>
  <text x="84" y="358" class="heading">2  Coordinate the round</text>
  <text x="84" y="392" class="body">Inherits your model + effort · splits packages, checks results, commits</text>
  <rect x="854" y="342" width="262" height="38" rx="19" fill="#26473f"/>
  <text x="985" y="367" text-anchor="middle" font-size="16" fill="#b7f4db">Up to 6 worker packages</text>
  <path d="M600 430V465" class="line"/>

  <text x="60" y="498" class="eyebrow">3  BUILD · INDEPENDENT PACKAGES RUN IN PARALLEL</text>
  <text x="60" y="527" class="small">Each package follows this retry path. Every retry starts a fresh worker.</text>

  <rect x="60" y="553" width="320" height="163" rx="16" fill="#163d3d" stroke="#3b8279"/>
  <text x="84" y="587" class="eyebrow">ATTEMPT 1</text>
  <text x="84" y="627" class="model">Claude: Sonnet</text>
  <text x="84" y="657" class="model">Codex: newest Luna</text>
  <text x="84" y="691" class="body">Effort: medium</text>

  <path d="M384 630H432" class="line"/>
  <text x="410" y="609" text-anchor="middle" font-size="12" fill="#afbed4">fails</text>
  <rect x="440" y="553" width="320" height="163" rx="16" class="box"/>
  <text x="464" y="587" class="eyebrow">ATTEMPT 2</text>
  <text x="464" y="627" class="model">Claude: Opus</text>
  <text x="464" y="657" class="model">Codex: newest Sol</text>
  <text x="464" y="691" class="body">Effort: medium</text>

  <path d="M764 630H812" class="line"/>
  <text x="790" y="609" text-anchor="middle" font-size="12" fill="#afbed4">fails</text>
  <rect x="820" y="553" width="320" height="163" rx="16" fill="#382f49" stroke="#79618f"/>
  <text x="844" y="587" class="eyebrow">ATTEMPT 3 / QUESTIONS</text>
  <text x="844" y="627" class="model">Claude: Opus</text>
  <text x="844" y="657" class="model">Codex: newest Sol</text>
  <text x="844" y="691" class="body">Effort: xhigh</text>
  <path d="M220 716V758H980V716M600 758V796" fill="none" stroke="#7d91ae" stroke-width="2"/>
  <path d="M600 716V758" fill="none" stroke="#7d91ae" stroke-width="2"/>
  <text x="60" y="787" class="small">Completed packages move to review; blocked dependencies stay out.</text>

  <rect x="60" y="814" width="1080" height="116" rx="16" class="box"/>
  <text x="84" y="851" class="heading">4  Review with fresh eyes</text>
  <text x="84" y="885" class="body">Claude: Opus · Codex: newest Sol · effort: high</text>
  <text x="84" y="911" class="small">One reviewer for the whole round. Critical / Important findings get one worker fix round.</text>
  <path d="M600 930V964" class="line"/>

  <rect x="60" y="978" width="1080" height="99" rx="16" fill="#163d3d" stroke="#3b8279"/>
  <text x="84" y="1015" class="heading">5  Ship the round</text>
  <text x="84" y="1048" class="body">Coordinator opens the PR → merges when checks pass → records progress</text>

  <rect x="60" y="1101" width="1080" height="73" rx="14" fill="#292f44" stroke="#586583"/>
  <text x="84" y="1131" font-size="20" font-weight="700">40% context handoff</text>
  <text x="84" y="1157" class="small">Coordinator: check after each round. Workers: check with validation. Write a handoff; use a fresh agent.</text>
  <text x="60" y="1207" class="small">Model routing shown for BB. Standalone agent files and host effort controls differ; see the README.</text>
  <text x="60" y="1232" class="small">Outside BB, the initiating conversation coordinates. Context-only replacements keep their attempt level.</text>
</svg>
